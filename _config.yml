#======================================================================
#                               Plugins
#======================================================================

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-minifier
  - jekyll-terser
  - jekyll_dynamic_assets
  - jekyll_picture_tag
  - jekyll-purge-css

#======================================================================
#                             Information
#======================================================================

url: "https://m-umar.me"
baseurl: "/preview"
title: MUS
description: The Archives of M. Umar Shahbaz
author: M. Umar Shahbaz
image: /assets/img/original/icon.png
logo: /assets/img/original/icon.png

#======================================================================
#                              Shareing
#======================================================================

share-presets:
  intro:
    class: intro
    sites:
      - Facebook
      - X
      - LinkedIn
      - Reddit
      - WhatsApp
      - Telegram
      - Messenger
      - Devto
      - Mail
  end:
    class: end
    sites:
      - Facebook
      - X
      - LinkedIn
      - Reddit
      - WhatsApp
      - Telegram
      - Messenger
      - Devto
      - Mail

#======================================================================
#                             Head links
#======================================================================

dynamic_assets:
  absolute: true
  master:
   - master.css
   - aos.min.js::defer-js
   - bootstrap.min.js::defer-js
   - fuse.min.js::defer-js
  formats:
    defer-js: <script defer src="%s"></script>

#======================================================================
#                        Archives & Collection
#======================================================================

collections:
  navbar_pages:
    output: true
  projects:
    output: true


#======================================================================
#                          Asset Optimizers
#======================================================================

jekyll-minifier:
  compress_javascript: false

terser:
  compress:
    drop_console: true

picture:
  source: "assets/img/original"
  output: "assets/img/"
  suppress_warnings: true
  relative: false
  fast_build: true

PurgeCSS:
  content: [./_site/**/*.html, ./_site/**/*.js]
  css: [./_site/assets/styles/*.css]
  output: ./_site/assets/styles/

#======================================================================
#                            Code Blocks
#======================================================================

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

#======================================================================
#                              Include/Exclude
#======================================================================

exclude:
  - .bundle/
  - .gitignore
  - .github/
  - .jekyll-cache/
  - .vscode/
  - docker_build/
  - .dockerignore
  - Dockerfile
  - Gemfile
  - Gemfile.lock